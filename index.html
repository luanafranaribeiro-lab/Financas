<script>
const SUPABASE_URL='https://dpjqqbtexbdmjqeecssq.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRwanFxYnRleGJkbWpxZWVjc3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMDE2ODAsImV4cCI6MjEwNjc3NzY4MH0.AwUT8KNwL2tzE39wzHTQxq73kt2Sh1noNA6hOeIBEM4';
const lembrar=()=>{try{return localStorage.getItem('berga-lembrar')!=='0'}catch{return true}};
const guarda={
  getItem:k=>{try{return localStorage.getItem(k)??sessionStorage.getItem(k)}catch{return null}},
  setItem:(k,v)=>{try{if(lembrar()){localStorage.setItem(k,v);sessionStorage.removeItem(k)}else{sessionStorage.setItem(k,v);localStorage.removeItem(k)}}catch{}},
  removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k)}catch{}}
};
const LINK=(()=>{const h=new URLSearchParams((location.hash||'').replace(/^#/,'')),q=new URLSearchParams(location.search);const g=k=>h.get(k)||q.get(k);
  return {recuperar:g('type')==='recovery',erro:g('error_code')||g('error')?(g('error_code')||g('error')):null}})();
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:guarda,persistSession:true}});
const emailSalvo=()=>{try{return localStorage.getItem('berga-email')||''}catch{return ''}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>v==null?'a definir':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESC=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const dataBR=d=>{if(!d)return'';const[a,m,dd]=d.split('-');return `${+dd} ${MESC[+m-1]}${+a!==new Date().getFullYear()?' '+a.slice(2):''}`};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2800)}
async function blocoMoveis(eid,excluir,modo){const {data,error}=await sb.rpc('moveis_disponiveis',{p_edicao:eid,p_excluir:excluir||null});const r=data?.[0];
  if(error||!r||(r.mesas_total==null&&r.cadeiras_total==null))return '';
  const it=(tot,us,nome)=>{if(tot==null)return '';const d=Math.max(tot-us,0);return `<div class="tile ${d===0?'zerado':''}"><b>${d}</b><span>${nome} disponíve${d===1?'l':'is'}</span><small>de ${tot} no local</small></div>`};
  S.movDisp={m:r.mesas_total==null?null:Math.max(r.mesas_total-r.mesas_usadas,0),c:r.cadeiras_total==null?null:Math.max(r.cadeiras_total-r.cadeiras_usadas,0)};
  return `<div class="painel moveis"><b class="secao">Mesas e cadeiras do local</b><div class="tiles" style="grid-template-columns:repeat(${(r.mesas_total!=null)+(r.cadeiras_total!=null)},minmax(0,1fr));margin:8px 0 0">${it(r.mesas_total,r.mesas_usadas,'Mesas')}${it(r.cadeiras_total,r.cadeiras_usadas,'Cadeiras')}</div>
    <p class="aovivo"><span class="pulso"></span>${modo==='org'?'Conta só quem está confirmado e já pagou. Muda conforme os expositores informam o que precisam.':modo==='montagem'?'Esse número muda a toda hora: conta o que os expositores confirmados e pagos já pediram. Se precisar de mais do que tem, leve as suas ou fale com a organização.':'Esse número muda conforme os expositores confirmados e pagos vão pedindo. Se for precisar, garanta logo na montagem.'}</p></div>`}
function erroMsg(e){const m=(e&&e.message)||String(e);if(/Invalid login/i.test(m))return'E-mail ou senha incorretos.';if(/already registered/i.test(m))return'Esse e-mail já tem conta. Use "Entrar".';if(/Password should/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';if(/rate limit|too many|429/i.test(m))return'Muita gente se cadastrando ao mesmo tempo. Espere uns minutos e tente de novo.';if(/not confirmed/i.test(m))return'Seu e-mail ainda não foi confirmado. Fale com a organização que a gente libera.';if(/valid email|invalid.*email|unable to validate email/i.test(m))return'Confira o e-mail: parece que tem algo digitado errado.';if(/Failed to fetch|NetworkError|Load failed/i.test(m))return'Sem conexão. Confira a internet e tente de novo.';return m}


function berg(t=28){return `<svg class="berg" width="${t}" height="${t}" viewBox="0 0 40 40" aria-hidden="true"><path d="M21 9c3-5 9-6 12-4-2 4-7 6-12 4z" fill="#47470C"/><path d="M20 10c0-2 0-3-1-5" stroke="#2E2E07" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="20" cy="23" r="13" fill="#F28A35"/><path d="M12 20c2-4 6-6 10-5" stroke="#F6B27A" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/><circle cx="20" cy="11.5" r="1.6" fill="#B85A18"/><g fill="#C9601F" opacity=".5"><circle cx="15" cy="27" r=".9"/><circle cx="24" cy="29" r=".9"/><circle cx="27" cy="22" r=".9"/><circle cx="19" cy="31" r=".9"/></g></svg>`}
const wm=(c='')=>`<span class="wm ${c}"><small>FEIRA</small><b>BÊRGA</b></span>`;
const topo=()=>`<div class="cabeca"><span class="cacho" aria-hidden="true"><span class="c1">${berg(46)}</span><span class="c2">${berg(30)}</span></span><div class="linha1">${wm()}<button class="papel" data-go="conta" style="border:0;color:inherit">${S.papel==='organizadora'?'Organização':'Expositor'} · Conta</button><button class="atualiza" id="atualizar" aria-label="Atualizar a tela" title="Atualizar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg></button></div><div class="ola">${S.papel!=='organizadora'&&S.marca?.logo_url?`<img class="logo" src="${esc(S.marca.logo_url)}" alt="" width="26" height="26" style="width:26px;height:26px;border-width:1.5px">`:''}${S.papel==='organizadora'?'Painel da organização'+(S.compNovos&&S.tela!=='org-selecao'?`</div><button class="aviso-comp" data-vercomp="1">📎 ${S.compNovos} comprovante${S.compNovos>1?'s':''} novo${S.compNovos>1?'s':''} pra conferir ›</button><div style="display:none">`:''):S.marca?'Olá, '+esc(S.marca.nome)+'!':'Que bom te ver por aqui!'}</div></div>`;
const S={sessao:null,papel:'expositor',marca:null,segs:[],tela:'inicio',edicao:null,orgEdicao:null,canal:null,mapaSel:null,vagaSel:null};

async function iniciar(){
  if(LINK.erro){try{history.replaceState(null,'',location.pathname)}catch{}}
  const {data}=await sb.auth.getSession();S.sessao=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{const antes=!!S.sessao;S.sessao=s;if(ev==='PASSWORD_RECOVERY'){S.tela='novasenha';render();return}if(!!s!==antes)carregarUsuario()});
  const r=await sb.from('segmentos').select('*').order('ordem');S.segs=r.data||[];
  await carregarUsuario();
}
async function contaComprovantes(){if(S.papel!=='organizadora')return;const [{count},{data:nv}]=await Promise.all([sb.from('inscricoes').select('id',{count:'exact',head:true}).eq('comprovante_novo',true).eq('status','confirmada'),sb.from('inscricoes').select('id,edicao_id,decisoes(decisao)').eq('status','recebida')]);S.compNovos=count||0;
  const pe={};(nv||[]).forEach(x=>{const dd=Array.isArray(x.decisoes)?x.decisoes[0]:x.decisoes;if(!dd?.decisao)pe[x.edicao_id]=(pe[x.edicao_id]||0)+1});S.novasEd=pe;S.insNovas=Object.values(pe).reduce((a,b)=>a+b,0);nav();atualizaBadgeIcone()}
let tAtu=null;function reRenderSuave(){clearTimeout(tAtu);tAtu=setTimeout(async()=>{if(!['org-selecao','org-edicoes'].includes(S.tela))return;const f=document.activeElement;if(f&&f.closest&&f.closest('#tela')&&/INPUT|TEXTAREA|SELECT/.test(f.tagName))return;const y=window.scrollY;await renderMantendo();window.scrollTo(0,y)},1500)}
function ouveComprovantes(){if(S.canalComp)return;S.canalComp=sb.channel('org-comprovantes').on('postgres_changes',{event:'UPDATE',schema:'public',table:'inscricoes'},async p=>{
  const n=p.new||{};const antes=S.compNovos||0;await contaComprovantes();reRenderSuave();
  if(n.comprovante_novo&&S.compNovos>antes){let nome='';try{const {data}=await sb.from('marcas').select('nome').eq('id',n.marca_id).maybeSingle();nome=data?.nome||''}catch{}
    toast(`📎 Comprovante novo${nome?' de '+nome:''}`);try{navigator.vibrate&&navigator.vibrate(200)}catch{}
    if(['org-selecao','org-edicoes','org-mapas','org-lista','org-feedback','org-propostas'].includes(S.tela)){const y=window.scrollY;await renderMantendo();window.scrollTo(0,y)}}})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'inscricoes'},async p=>{const n=p.new||{};await contaComprovantes();let nome='';try{const {data}=await sb.from('marcas').select('nome').eq('id',n.marca_id).maybeSingle();nome=data?.nome||''}catch{}
    toast(`🍊 Nova inscrição${nome?': '+nome:''}`);try{navigator.vibrate&&navigator.vibrate(200)}catch{}
    if(['org-selecao','org-edicoes'].includes(S.tela)){const y=window.scrollY;await renderMantendo();window.scrollTo(0,y)}}).subscribe()}
async function carregarUsuario(){
  if(LINK.recuperar&&S.sessao){LINK.recuperar=false;S.tela='novasenha';try{history.replaceState(null,'',location.pathname)}catch{}return render()}
  if(!S.sessao){S.papel='expositor';S.marca=null;S.tela=location.hash==='#proposta'?'proposta':'auth';return render()}
  const uid=S.sessao.user.id;
  const [p,m]=await Promise.all([sb.from('perfis').select('papel').eq('id',uid).maybeSingle(),sb.from('marcas').select('*').eq('dono',uid).maybeSingle()]);
  S.papel=p.data?.papel||'expositor';S.marca=m.data;
  S.tela=S.papel==='organizadora'?'org-edicoes':'inicio';
  const qs=new URLSearchParams(location.search),ab=qs.get('abrir'),abId=qs.get('id');
  if(S.papel!=='organizadora'){if(pushEstado()==='ligado')assinaPush(false).catch(()=>{});
    if(ab==='ed'&&abId){try{history.replaceState(null,'',location.pathname)}catch{}const {data:edA}=await sb.from('edicoes').select('*').eq('id',abId).maybeSingle();if(edA&&S.marca){S.edicao=edA;S.tela='edicao'}}}
  if(S.papel==='organizadora'){await contaComprovantes();ouveComprovantes();if(pushEstado()==='ligado')assinaPush(false).catch(()=>{});
    if(ab){try{history.replaceState(null,'',location.pathname)}catch{}if(ab==='ed'&&abId){S.orgEdicao=abId;S.gAbertos=new Set();S.tela='org-selecao'}S.gAbertos=new Set();if(ab==='comprovantes'){S.irComp=true;S.tela='org-selecao'}else if(ab==='selecao'){const eN=Object.keys(S.novasEd||{})[0];if(eN)S.orgEdicao=eN;S.filtroSel='novas';S.tela='org-selecao'}}}
  render();
}
/* ===== notificações (push) ===== */
const pushSuporta=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const ehIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ehAtalho=()=>window.matchMedia?.('(display-mode: standalone)').matches||navigator.standalone===true;
const pushEstado=()=>{if(ehIOS()&&!ehAtalho())return 'atalho';if(!pushSuporta())return 'nao';return Notification.permission==='granted'?'ligado':Notification.permission==='denied'?'bloqueado':'desligado'};
function b64u8(b){const p='='.repeat((4-b.length%4)%4);const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}
async function assinaPush(pedir){if(!pushSuporta())return false;
  if(pedir&&Notification.permission!=='granted'){const pr=await Notification.requestPermission();if(pr!=='granted')return false}
  if(Notification.permission!=='granted')return false;
  const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
  if(!sub){const {data:k,error}=await sb.rpc('vapid_publica');if(error||!k)return false;sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(k)})}
  const j=sub.toJSON();const r=await sb.rpc('salvar_push',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});return !r.error}
function atualizaBadgeIcone(){try{const n=(S.compNovos||0)+(S.insNovas||0);if(navigator.setAppBadge){n>0?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch{}}
const pushOque=()=>S.papel==='organizadora'?'aviso de inscrição nova e de comprovante novo':'aviso quando sua presença for confirmada, quando o mapa liberar, quando abrir edição nova e quando as inscrições abrirem';
const blocoPush=()=>{const st=pushEstado();
  if(st==='ligado')return `<div class="painel"><b class="secao">🔔 Notificações</b><p style="margin:6px 0 10px;font-size:14px">Ligadas neste celular. Você recebe ${pushOque()}, mesmo com o app fechado.</p><button class="mini" id="push-teste" style="width:100%;min-height:44px">Enviar notificação de teste</button></div>`;
  if(st==='atalho')return `<div class="painel" style="background:var(--laranja-soft);border-color:var(--laranja)"><b class="secao">🔔 Notificações</b><p style="margin:6px 0 0;font-size:14px">No iPhone, as notificações só funcionam pelo <b>atalho na tela de início</b>. Abra o app por lá e ative aqui em Conta.</p></div>`;
  if(st==='bloqueado')return `<div class="painel"><b class="secao">🔔 Notificações</b><p style="margin:6px 0 0;font-size:14px">As notificações foram bloqueadas neste celular. Pra liberar, vá nos ajustes do celular, procure o app Bêrga (ou o navegador) e permita notificações.</p></div>`;
  if(st==='nao')return `<div class="painel"><b class="secao">🔔 Notificações</b><p style="margin:6px 0 0;font-size:14px">Este navegador não aceita notificações. No iPhone, use o atalho na tela de início (iOS 16.4 ou mais novo).</p></div>`;
  return `<div class="painel" style="background:var(--laranja-soft);border-color:var(--laranja)"><b class="secao">🔔 Ativar notificações</b><p style="margin:6px 0 10px;font-size:14px">Receba ${pushOque()} neste celular, mesmo com o app fechado.</p><button class="btn pri" id="push-ligar">Ativar notificações</button></div>`};
const bannerPush=()=>{const st=pushEstado();if(!['desligado','atalho'].includes(st)||S.pushDispensado)return '';try{const d=+localStorage.getItem('pushDisp')||0;if(Date.now()-d<5*86400000)return ''}catch{}
  return `<div class="painel" style="background:var(--laranja-soft);border-color:var(--laranja);display:flex;gap:10px;align-items:center"><span style="font-size:22px">🔔</span><div style="flex:1;font-size:14px">${st==='atalho'?'Abra pelo atalho da tela de início pra ativar as notificações.':S.papel==='organizadora'?'Ative as notificações pra saber na hora de inscrição e comprovante novo.':'Ative as notificações pra saber na hora quando abrir inscrição, quando for confirmada e quando o mapa liberar.'}</div>${st==='desligado'?`<button class="mini pri" id="push-ligar" style="min-height:40px">Ativar</button>`:''}<button class="mini" id="push-dispensa" aria-label="Fechar" style="min-height:40px">✕</button></div>`};
const segNome=s=>S.segs.find(x=>x.slug===s)?.nome||s;

const NI={inicio:'<path d="M4 8h16v12H4z"/><path d="M4 8l2-4h12l2 4M9 20v-6h6v6"/>',marca:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',conta:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>','org-edicoes':'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>','org-selecao':'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 11l2 2 4-4"/>','org-mapas':'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>','org-lista':'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>','org-feedback':'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>','org-propostas':'<path d="M4 21V5l8-2v18M12 8h8v13M4 21h16"/>'};
function nav(){
  const n=$('#nav');if(!S.sessao){n.hidden=true;return}n.hidden=false;
  const itens=S.papel==='organizadora'?[['org-edicoes','Edições'],['org-selecao','Seleção'],['org-mapas','Mapas'],['org-lista','Lista'],['org-feedback','Feedback'],['org-propostas','Espaços']]:[['inicio','Feira'],['marca','Minha marca'],['conta','Conta']];
  $('#navin').innerHTML=itens.map(([t,l])=>`<button data-go="${t}" ${S.tela===t||(t==='inicio'&&['edicao','mapa','montagem','feedback'].includes(S.tela))||(t==='org-selecao'&&S.tela==='org-inscrito')||(t==='org-edicoes'&&S.tela==='org-edicao-form')?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${NI[t]||''}</svg>${l}${t==='org-selecao'&&S.compNovos?`<i class="badge">${S.compNovos}</i>`:''}${t==='org-edicoes'&&S.insNovas?`<i class="badge">${S.insNovas}</i>`:''}</button>`).join('');
}
async function render(){
  nav();const T=TELAS[S.tela]||TELAS.inicio;
  try{const h=await T();$('#tela').innerHTML=(S.sessao&&!['auth','novasenha'].includes(S.tela)?topo():'')+h}catch(e){$('#tela').innerHTML=`<h1>Ops</h1><p class="sub">${esc(erroMsg(e))}</p><button class="btn sec" data-go="inicio">Voltar</button>`}
  window.scrollTo(0,0);enfeitaDatas();if(AFTER[S.tela])AFTER[S.tela]();
}
document.addEventListener('toggle',ev=>{const d=ev.target;if(!d.dataset||!d.dataset.grupo)return;S.gAbertos=S.gAbertos||new Set();if(d.open)S.gAbertos.add(d.dataset.grupo);else S.gAbertos.delete(d.dataset.grupo)},true);
function go(t){if(t==='org-selecao')S.gAbertos=new Set();if(S.canal){sb.removeChannel(S.canal);S.canal=null}S.tela=t;render()}

/* ================= AUTENTICAÇÃO ================= */
let modoAuth='entrar';
const TELAS={};const AFTER={};
TELAS.auth=()=>`${LINK.erro?`<div class="painel" style="background:var(--tomate-soft);border-color:var(--tomate);color:var(--ink)"><b>Esse link não vale mais</b><p style="margin:4px 0 0;font-size:14px">${/expired|otp/i.test(LINK.erro)?'Ele expirou ou já foi usado. Se você pediu pra redefinir a senha mais de uma vez, só o <b>último e-mail</b> funciona. Ou toque em "Esqueci minha senha" de novo e use o link novo.':'Tente de novo ou fale com a organização.'}</p></div>`:''}<div class="hero"><span class="b1">${berg(96)}</span><span class="b2">${berg(44)}</span>${wm('grande')}<div class="onda" style="margin:14px 0 10px"></div><p style="font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:1">Inscrições</p><p>${modoAuth==='entrar'?'Entre pra se inscrever nas edições.':'Crie sua conta. Leva um minuto.'}</p></div><div class="painel" style="margin-top:12px">
<label for="a-email">E-mail</label><input id="a-email" type="email" autocomplete="email" value="${esc(emailSalvo())}">
<label for="a-senha">Senha</label><div class="senha"><input id="a-senha" type="password" autocomplete="${modoAuth==='entrar'?'current-password':'new-password'}"><button type="button" class="olho" data-olho="a-senha" aria-label="Mostrar senha" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
${modoAuth==='criar'?'<p class="sub" style="margin:4px 0 0;font-size:12px">Mínimo de 6 caracteres.</p>':''}
<label class="check" style="margin-top:12px"><input type="checkbox" id="a-lembrar" ${lembrar()?'checked':''}> Lembrar usuário</label>
<p class="erro" id="a-err"></p>

const fimEd=e=>e.data_fim||e.data;
const pascoa=a=>{const b=a%19,c=Math.floor(a/100),d=a%100,e=Math.floor(c/4),f=c%4,g=Math.floor((c+8)/25),h=Math.floor((c-g+1)/3),i=(19*b+c-e-h+15)%30,k=Math.floor(d/4),l=d%4,m=(32+2*f+2*k-i-l)%7,n=Math.floor((b+11*i+22*m)/451),mes=Math.floor((i+m-7*n+114)/31),dia=((i+m-7*n+114)%31)+1;return new Date(a,mes-1,dia,12)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const feriados=a=>{const sx=pascoa(a);sx.setDate(sx.getDate()-2);return new Set([`${a}-01-01`,iso(sx),`${a}-04-21`,`${a}-05-01`,`${a}-09-07`,`${a}-10-12`,`${a}-11-02`,`${a}-11-15`,`${a}-11-20`,`${a}-12-25`])};
const quintoUtil=(a,m)=>{const fe=feriados(a);const d=new Date(a,m,1,12);let n=0;for(;;){const w=d.getDay();if(w>0&&w<6&&!fe.has(iso(d))){n++;if(n===5)return iso(d)}d.setDate(d.getDate()+1)}};
const sugereVenc=data=>{if(!data)return '';const[a,m]=data.split('-').map(Number);const q=quintoUtil(a,m-1);if(q<data)return q;const pm=m-2<0?[a-1,11]:[a,m-2];return quintoUtil(pm[0],pm[1])};
const prazoRestante=e=>e.vencimento_restante||sugereVenc(e.data);
const garantiu=i=>!!(i&&(i.pago||i.pago_sinal));
const abertaJa=e=>!!(e.inscricoes_abertas||(e.abre_inscricoes_em&&new Date(e.abre_inscricoes_em)<=new Date()));
const agendada=e=>!e.inscricoes_abertas&&e.abre_inscricoes_em&&new Date(e.abre_inscricoes_em)>new Date();
const quandoAbre=e=>{const d=new Date(e.abre_inscricoes_em);const h=d.getHours(),mi=d.getMinutes();return `${d.getDate()} ${MESC[d.getMonth()]}, ${h}h${mi?String(mi).padStart(2,'0'):''}`};
const tamLabel=t=>t==='unico'?'Espaço único':t==='3m'?'3 m × 1,30 m':t==='2m'?'2 m × 1,30 m':String(t||'');
const tamCurto=t=>t==='unico'?'Espaço único':String(t||'').replace('m',' m');
const hojeLocal=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};
const menosDias=(d,n)=>{if(!d)return '';const x=new Date(d+'T12:00:00');x.setDate(x.getDate()-n);return x.toISOString().slice(0,10)};
const prazoVaga=e=>e.prazo_escolha_vaga?new Date(e.prazo_escolha_vaga):(e.data?new Date(menosDias(e.data,2)+'T23:59:00'):null);
const vagaFechada=e=>{const p=prazoVaga(e);return !!p&&new Date()>p};
const prazoVagaTxt=e=>{const p=prazoVaga(e);return p?`${p.getDate()} ${MESC[p.getMonth()]}`:''};
const limRoleta=e=>e.roleta_limite||menosDias(e.data,2);
const blocoRoleta=(ins,e)=>{const lim=limRoleta(e),fechado=hojeLocal()>lim;
  if(fechado)return `<div class="painel roleta" style="border-color:var(--line)"><b class="secao">🎡 Roleta premiada</b>${ins.roleta&&(ins.roleta_itens||[]).length?`<p class="status ok" style="margin:8px 0 6px;display:inline-flex">Você está na roleta</p>${ins.roleta_itens.map(x=>`<div class="kv"><span>${x.tipo==='brinde'?'🎁 Brinde':'🏷️ Desconto'}</span><b>${esc(x.txt)} · ${x.qtd}×</b></div>`).join('')}`:`<p style="margin:6px 0 0;font-size:14px">Você não entrou na roleta dessa edição.</p>`}<p class="sub" style="margin:8px 0 0;font-size:13px">O prazo pra mexer na roleta acabou em ${dataBR(lim)}. Pra mudar algo, fale com a organização.</p></div>`;if(S.rlFor!==ins.id){S.rlFor=ins.id;S.rlItens=(ins.roleta_itens||[]).map(x=>({tipo:x.tipo,txt:x.txt||'',qtd:x.qtd??''}))}

const rlLista=()=>{const it=S.rlItens||[];if(!it.length)return '<p class="sub" style="margin:4px 0;font-size:13px">Nenhum ainda. Toque em + Desconto ou + Brinde 👇</p>';

function imprimirRoleta(){const it=S.roletaItens||[];if(!it.length){toast('Nenhuma tira pra imprimir');return}
  document.getElementById('impressao')?.remove();const w=document.createElement('div');w.id='impressao';

  w.innerHTML=grupo('Brinde','🎁 Brindes')+grupo('Desconto','🏷️ Descontos');
  document.body.appendChild(w);document.body.classList.add('imprimindo');const fim=()=>{document.body.classList.remove('imprimindo');w.remove();window.removeEventListener('afterprint',fim)};window.addEventListener('afterprint',fim);setTimeout(()=>window.print(),150)}
const montaAntes=e=>!!(e&&e.data_montagem&&e.data_montagem<e.data);
const avisoMonta=e=>`<b>⚠️ Muito importante:</b> a montagem dessa edição é no dia <b>${dataBR(e.data_montagem)}</b>${e.horario_montagem?', '+esc(e.horario_montagem):''}, e é muito importante que ela seja feita nesse dia. Só marque essa opção se realmente não tiver como. Se marcar, chegue bem cedo no dia ${dataBR(e.data)} pra deixar tudo pronto antes de a feira abrir${e.horario_feira?' ('+esc(e.horario_feira)+')':''}.`;
const blocoMonta=(e,id,on)=>montaAntes(e)?`<div class="monta-q"><p class="sub" style="margin:14px 0 6px">A montagem é no dia anterior: <b>${dataBR(e.data_montagem)}</b>${e.horario_montagem?', '+esc(e.horario_montagem):''}.</p><label class="check" style="margin:0"><input type="checkbox" id="${id}" ${on?'checked':''} style="accent-color:var(--tomate)"> Preciso montar no dia da feira (${dataBR(e.data)})</label><div class="aviso-monta" ${on?'':'hidden'}>${avisoMonta(e)}</div></div>`:'';
const semMetragem=seg=>!!S.segs.find(x=>x.slug===seg)?.sem_metragem;
const recebidoDe=(i,e)=>{const cheio=+precoDe(e,i.tamanho,i.dia_unico)||0,vp=i.valor_pago!=null?+i.valor_pago:null;if(i.pago)return Math.max(cheio,vp||0);if(i.pago_sinal)return vp!=null&&vp>0?vp:Math.round(cheio*50)/100;return vp||0};
const resumoFin=(lista,e,pres)=>{const cf=lista.filter(i=>i.status==='confirmada'&&!i.isento);let rec=0,prev=0;cf.forEach(i=>{prev+=+precoDe(e,i.tamanho,i.dia_unico)||0;rec+=recebidoDe(i,e)});(pres||[]).forEach(r=>{const v=+r.valor_pago||0;rec+=v;prev+=v});return {rec:Math.round(rec*100)/100,prev:Math.round(prev*100)/100,falta:Math.max(0,Math.round((prev-rec)*100)/100)}};
const precoDe=(e,t,dia)=>dia&&e.preco_dia!=null?e.preco_dia:t==='unico'?e.preco_unico:t==='3m'?e.preco_3m:e.preco_2m;
const diasDe=e=>{const r=[];if(!e.data_fim)return r;let d=new Date(e.data+'T12:00:00');const f=new Date(e.data_fim+'T12:00:00');while(d<=f){r.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return r};
const zapLink=(num,txt)=>{const n=String(num||'').replace(/\D/g,'');return `https://wa.me/${n?(n.length<=11?'55'+n:n):''}?text=${encodeURIComponent(txt)}`};

const hfmt=t=>{if(!t)return'';const[h,m]=t.split(':');return `${+h}h${m!=='00'?m:''}`};

async function montaVizinhos(){
  const e=S.edicao,ins=S.ins;if(!e||!ins||ins.status!=='confirmada')return '';
  if(!e.mapa_id)return `<div class="painel"><b class="secao">Seu lugar na feira</b><p class="sub" style="margin:4px 0 0">O mapa dessa edição ainda não foi publicado.</p></div>`;
  const [mp,vg,oc]=await Promise.all([sb.from('mapas').select('areas').eq('id',e.mapa_id).maybeSingle(),sb.from('mapa_vagas').select('id,numero,x,y,largura,altura').eq('mapa_id',e.mapa_id),sb.from('vagas_ocupadas').select('vaga_id,marca_nome').eq('edicao_id',e.id)]);
  const vagas=vg.data||[],ocup=new Map((oc.data||[]).map(x=>[x.vaga_id,x.marca_nome]));
  const altM=vagas.length?vagas.reduce((t,v)=>t+(v.altura||8),0)/vagas.length:8,largM=vagas.length?vagas.reduce((t,v)=>t+(v.largura||8),0)/vagas.length:8;
  const vizinho=(me,dir)=>{let c=vagas.filter(v=>v.id!==me.id);
    if(dir==='e'||dir==='d')c=c.filter(v=>Math.abs(v.y-me.y)<altM*.6&&(dir==='e'?v.x<me.x:v.x>me.x)&&Math.abs(v.x-me.x)<largM*3);
    else c=c.filter(v=>(dir==='c'?v.y<me.y:v.y>me.y)&&Math.abs(v.y-me.y)>=altM*.6&&Math.abs(v.y-me.y)<altM*3.2&&Math.abs(v.x-me.x)<largM*1.2);
    c.sort((a,b)=>Math.hypot(a.x-me.x,a.y-me.y)-Math.hypot(b.x-me.x,b.y-me.y));return c[0]||null};
  const celula=(v,rot)=>`<div class="cz">${v?`<small>${rot} · vaga ${v.numero}</small>${ocup.get(v.id)?`<b>${esc(ocup.get(v.id))}</b>`:'<span class="livre">livre</span>'}`:`<small>${rot}</small><span class="livre">—</span>`}</div>`;
  const cruz=me=>`<div class="cruz"><div></div>${celula(vizinho(me,'c'),'Acima')}<div></div>${celula(vizinho(me,'e'),'Esquerda')}<div class="cz eu"><small>Você</small><b>${me.numero}</b></div>${celula(vizinho(me,'d'),'Direita')}<div></div>${celula(vizinho(me,'b'),'Abaixo')}<div></div></div>`;
  const perto=(x,y,excl)=>vagas.filter(v=>v.id!==excl).map(v=>({v,d:Math.hypot(v.x-x,(v.y-y)*0.7)})).sort((a,b)=>a.d-b.d).slice(0,4).map(({v})=>`<div class="viz"><span>Vaga ${v.numero}</span>${ocup.get(v.id)?`<b>${esc(ocup.get(v.id))}</b>`:'<span class="livre">livre</span>'}</div>`).join('');
  const area=areaSeg(mp.data,S.marca.segmento);
  if(area){const {data:oa}=await sb.rpc('ocupacao_areas',{p_edicao:e.id});const outros=(oa||[]).filter(x=>x.segmento===area.segmento&&x.marca_nome!==S.marca.nome);
    return `<div class="painel"><div class="lugar"><span class="num" style="font-size:15px;text-align:center;line-height:1.1">${esc(area.nome)}</span><div><b class="secao">Seu lugar na feira</b><div class="sub" style="margin:0">Área reservada pra ${esc(segNome(S.marca.segmento))}</div></div></div>
    <p style="margin:12px 0 0;font-weight:700">Com você na área</p>${outros.length?outros.map(x=>`<div class="viz"><span>${esc(segNome(x.segmento))}</span><b>${esc(x.marca_nome)}</b></div>`).join(''):'<p class="sub" style="margin:4px 0 0">Ninguém mais por enquanto.</p>'}
    ${vagas.length?`<p style="margin:12px 0 0;font-weight:700">Vagas mais perto</p>${perto(area.x,area.y,null)}`:''}<p class="sub" style="margin:10px 0 0;font-size:12px">Atualiza sozinho conforme as pessoas escolhem os lugares.</p></div>`}
  const minha=vagas.find(v=>v.id===ins.vaga_id);
  if(!minha)return `<div class="painel"><b class="secao">Seu lugar na feira</b><p class="sub" style="margin:4px 0 0">${garantiu(ins)?'Você ainda não escolheu sua vaga. Toque em "Escolher minha vaga" aqui embaixo.':'Depois do pagamento, você escolhe sua vaga no mapa e vê quem fica do seu lado.'}</p></div>`;
  return `<div class="painel"><div class="lugar"><span class="num">${minha.numero}</span><div><b class="secao">Seu lugar na feira</b><div class="sub" style="margin:0">Vaga ${minha.numero} · ${tamLabel(ins.tamanho)}</div></div></div>
  <p style="margin:12px 0 6px;font-weight:700">Ao seu redor</p>${cruz(minha)}<p class="sub" style="margin:8px 0 0;font-size:12px">Posições como aparecem no mapa.</p><p class="sub" style="margin:10px 0 0;font-size:12px">Atualiza sozinho conforme as pessoas escolhem os lugares.</p></div>`;
}

  let fora=new Set();if(disponiveis.length){const {data:zs}=await sb.from('edicao_cotas').select('edicao_id').eq('segmento',S.marca.segmento).eq('limite',0).in('edicao_id',disponiveis.map(e=>e.id));fora=new Set((zs||[]).map(z=>z.edicao_id))}
  if(!S.abaExp)S.abaExp=futuras.length?'minhas':'disponiveis';
  const selo=(e,i,pas)=>pas?(i&&i.status==='confirmada'?(e.link_fotos?['Fotos disponíveis','ok']:['Você participou','n']):['Encerrada','n']):!i&&fora.has(e.id)?['Fora dessa edição','n']:!i?(abertaJa(e)?['Inscrições abertas','ok']:agendada(e)?['Abre '+quandoAbre(e),'']:['Em breve','n']):i.status==='encerrada'?['Vagas preenchidas','n']:i.status==='confirmada'?(i.pago?['Presença confirmada','ok']:i.pago_sinal?['Falta o restante','t']:['Pagamento pendente','t']):['Inscrição recebida',''];
  const faltaDias=e=>{const d=Math.ceil((new Date(e.abre_inscricoes_em)-new Date())/86400000);return d<=1?'abre amanhã ou hoje':`faltam ${d} dias`};
  const card=(e,i,pas)=>{const [t,c]=selo(e,i,pas);const fech=!pas&&!i&&!abertaJa(e);return `<button class="cardfeira ${pas?'passada':''} ${fech?'fechada':''}" data-ed="${e.id}" style="width:100%;text-align:left;padding:0;display:block">${toldo(e,null)}<div class="c"><div class="topo"><p style="font-size:20px;margin:0">${esc(e.titulo)}</p><span class="status ${c}">${fech?'🔒 ':''}${t}</span></div><p class="sub" style="margin:2px 0 0">${periodo(e)}${e.local?' · '+esc(e.local):''}</p>${fech?`<p class="trava">${agendada(e)?`Inscrições ainda fechadas · ${faltaDias(e)}`:'Inscrições ainda fechadas'}</p>`:''}</div></button>`};
  const avisoLogo=!S.marca.logo_url?`<div class="painel" style="background:var(--laranja-soft);border-color:var(--laranja)"><b>Falta a logo da sua marca</b><p style="margin:4px 0 10px">Ela passou a ser obrigatória. Adicione pra liberar novas inscrições.</p><button class="btn pri" data-go="marca">Adicionar logo</button></div>`:'';
  const abas=`<div class="abas" role="group" aria-label="Feiras"><button data-aba="minhas" aria-pressed="${S.abaExp==='minhas'}">Minhas feiras<small>${futuras.length}</small></button><button data-aba="disponiveis" aria-pressed="${S.abaExp==='disponiveis'}">Disponíveis<small>${disponiveis.length}</small></button></div>`;
  let corpo='';
  if(S.abaExp==='minhas'){
    corpo=(futuras.length?futuras.map(x=>card(x.edicoes,x,false)).join(''):`<div class="vazio">${berg(64)}<p class="sub">Você ainda não está inscrita em nenhuma feira que vem por aí.</p><button class="btn pri" data-aba="disponiveis" style="max-width:300px;margin:0 auto">Ver feiras disponíveis</button></div>`)
      +(passadas.length?`<h2>Histórico</h2><p class="sub" style="margin-top:-6px">Toque pra ver fotos e detalhes.</p>${passadas.map(x=>card(x.edicoes,x,true)).join('')}`:'');
  }else{
    const abertasD=disponiveis.filter(e=>abertaJa(e)),embreveD=disponiveis.filter(e=>!abertaJa(e));
    corpo=disponiveis.length?(abertasD.length?`<h2 class="gr-ed">Inscrições abertas</h2>${abertasD.map(e=>card(e,null,false)).join('')}`:'')+(embreveD.length?`<h2 class="gr-ed">Em breve</h2><p class="sub" style="margin:-6px 0 10px">Ainda não dá pra se inscrever. Já dá pra ver as informações e deixar a marca pronta.</p>${embreveD.map(e=>card(e,null,false)).join('')}`:''):`<div class="vazio">${berg(64)}<p class="sub">Nenhuma feira aberta agora. Assim que a próxima abrir, ela aparece aqui.</p></div>`;
  }
  S.avisoRest=futuras.find(x=>x.status==='confirmada'&&x.pago_sinal&&!x.pago)||null;
  S.avisoVaga=futuras.find(x=>x.status==='confirmada'&&garantiu(x)&&!x.vaga_id&&x.edicoes?.mapa_id&&!vagaFechada(x.edicoes))||null;
  S.avisoMont=futuras.find(x=>x.status==='confirmada'&&!(Array.isArray(x.montagem)?x.montagem.length:x.montagem))||null;
  return cardPend()+avisoLogo+bannerPush()+`<h1>Feiras</h1>`+abas+corpo;
};

function mostraAvisoRestante(){const x=S.avisoRest;if(!x||!x.edicoes)return;const e=x.edicoes;const hoje=new Date();const hj=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');

  const dias=Math.max(0,Math.round((new Date(e.data+'T12:00:00')-new Date(hj+'T12:00:00'))/86400000));const venc=prazoRestante(e);const v=precoDe(e,x.tamanho,x.dia_unico);const met=v!=null?Math.round(v*50)/100:null;

function mostraAvisoMontagem(){const x=S.avisoMont;if(!x||!x.edicoes)return;const e=x.edicoes;const hoje=new Date();const hj=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');

  document.body.appendChild(o);const fecha=()=>o.remove();o.querySelector('#av-ok').onclick=fecha;o.addEventListener('click',ev=>{if(ev.target===o)fecha()});

async function mostraAvisoVaga(){const x=S.avisoVaga;if(!x||!x.edicoes)return false;const e=x.edicoes;const hoje=new Date();const hj=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0')+'-'+String(hoje.getDate()).padStart(2,'0');

async function detectarVagasImg(url){
  const img=new Image();img.crossOrigin='anonymous';img.src=url;await img.decode();
  const W=Math.min(900,img.naturalWidth),sc=W/img.naturalWidth,H=Math.round(img.naturalHeight*sc);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,W,H);
  const px=cx.getImageData(0,0,W,H).data;const N=W*H;const m=new Uint8Array(N);
  for(let i=0;i<N;i++){const r=px[i*4],g=px[i*4+1],b=px[i*4+2];m[i]=(r>140&&r-g>55&&r-b>80&&g<160)?1:0}
  const lab=new Int32Array(N);const comps=[];const st=new Int32Array(N);
  for(let i=0;i<N;i++){if(!m[i]||lab[i])continue;const id=comps.length+1;let sp=0;st[sp++]=i;lab[i]=id;let x0=1e9,x1=-1,y0=1e9,y1=-1,c=0;
    while(sp){const k=st[--sp];const x=k%W,y=(k/W)|0;c++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&m[k-1]&&!lab[k-1]){lab[k-1]=id;st[sp++]=k-1}if(x<W-1&&m[k+1]&&!lab[k+1]){lab[k+1]=id;st[sp++]=k+1}
      if(y>0&&m[k-W]&&!lab[k-W]){lab[k-W]=id;st[sp++]=k-W}if(y<H-1&&m[k+W]&&!lab[k+W]){lab[k+W]=id;st[sp++]=k+W}}
    comps.push({x0,x1,y0,y1,c,w:x1-x0+1,h:y1-y0+1})}
  let cand=comps.filter(o=>o.w>=8&&o.h>=8&&o.w/o.h>0.55&&o.w/o.h<1.9&&o.c/(o.w*o.h)>0.5);
  if(!cand.length)return[];
  const ar=cand.map(o=>o.w*o.h).sort((a,b)=>a-b),med=ar[ar.length>>1];
  cand=cand.filter(o=>{const a=o.w*o.h;return a>med*0.4&&a<med*2.6});
  cand.sort((a,b)=>a.y0-b.y0);const bands=[];
  for(const o of cand){const b=bands.find(b=>o.y0<b.y1&&o.y1>b.y0);if(b){b.it.push(o);b.y0=Math.min(b.y0,o.y0);b.y1=Math.max(b.y1,o.y1)}else bands.push({y0:o.y0,y1:o.y1,it:[o]})}
  bands.sort((a,b)=>a.y0-b.y0);const out=[];
  bands.forEach(b=>b.it.sort((p,q)=>(p.x0+p.x1)-(q.x0+q.x1)).forEach(o=>out.push({x:+((o.x0+o.x1+1)/2/W*100).toFixed(2),y:+((o.y0+o.y1+1)/2/H*100).toFixed(2),largura:+(o.w/W*100).toFixed(2),altura:+(o.h/H*100).toFixed(2),tamanho:o.w/o.h>1.35?'3m':'2m'})));
  return out;
}

const PALAVRAS_AREA=[{seg:'tatuagem',nome:'Flash Tattoo',re:/flash|tatt?oo|tatuagem/i},{seg:'piercing',nome:'Piercing',re:/piercing/i}];
function carregaOCR(){return window.Tesseract?Promise.resolve():new Promise((ok,err)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=ok;sc.onerror=err;document.head.appendChild(sc)})}
function caixasDeRotulo(img){
  const W=Math.min(1200,img.naturalWidth),H=Math.round(img.naturalHeight*W/img.naturalWidth);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0,W,H);
  const px=cx.getImageData(0,0,W,H).data,N=W*H,m=new Uint8Array(N);
  for(let k=0;k<N;k++){const r=px[k*4],g=px[k*4+1],b=px[k*4+2];m[k]=(r>=226&&r<=252&&g>=218&&g<=246&&b>=200&&b<=236&&r-b>=8)?1:0}
  const lab=new Int32Array(N),st=new Int32Array(N),out=[];let id=0;
  for(let k=0;k<N;k++){if(!m[k]||lab[k])continue;id++;let sp=0;st[sp++]=k;lab[k]=id;let x0=1e9,x1=-1,y0=1e9,y1=-1,c=0;
    while(sp){const q=st[--sp],x=q%W,y=(q/W)|0;c++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      if(x>0&&m[q-1]&&!lab[q-1]){lab[q-1]=id;st[sp++]=q-1}if(x<W-1&&m[q+1]&&!lab[q+1]){lab[q+1]=id;st[sp++]=q+1}
      if(y>0&&m[q-W]&&!lab[q-W]){lab[q-W]=id;st[sp++]=q-W}if(y<H-1&&m[q+W]&&!lab[q+W]){lab[q+W]=id;st[sp++]=q+W}}

  return {cv,W,H,caixas:out};
}
async function detectarAreas(m,silencioso){
  if(!m?.imagem_url)return 0;
  try{
    if(!silencioso)toast('Lendo os textos da planta…');
    const [img]=await Promise.all([carregaImg(m.imagem_url),carregaOCR()]);
    const {cv,W,H,caixas}=caixasDeRotulo(img);if(!caixas.length)return 0;
    const w=await Tesseract.createWorker('por');await w.setParameters({tessedit_pageseg_mode:'6'});

    for(const c of caixas){const k=3,cc=document.createElement('canvas');cc.width=c.w*k;cc.height=c.h*k;const g=cc.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,c.x0,c.y0,c.w,c.h,0,0,cc.width,cc.height);
      const {data}=await w.recognize(cc);const txt=(data.text||'').replace(/\s+/g,' ');

      if(P)achadas.push({segmento:P.seg,nome:P.nome,x:+((c.x0+c.w/2)/W*100).toFixed(2),y:+((c.y0+c.h/2)/H*100).toFixed(2),largura:+(c.w/W*100).toFixed(2),altura:+(c.h/H*100).toFixed(2)})}
    await w.terminate();
    if(!achadas.length)return 0;
    const areas=[...(m.areas||[]).filter(a=>!achadas.some(n=>n.segmento===a.segmento)),...achadas];
    const r=await sb.from('mapas').update({areas}).eq('id',m.id);if(r.error){toast(erroMsg(r.error));return 0}

function carregaImg(url){return new Promise((ok,err)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=err;i.src=url})}
function rr(cx,x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
async function exportarMapa(soNomes){
  const m=S.mapas.find(x=>x.id===S.mapaSel),e=S.mapaEds.find(x=>x.id===S.mapaEdSel);

  const mc=i=>{const mo=Array.isArray(i.montagem)?i.montagem[0]:i.montagem;return {nome:i.marcas?.nome||'',mesas:mo?.mesas??null,cad:mo?.cadeiras??null}};
  const areas=m.areas||[],segArea=new Set(areas.map(a=>a.segmento)),naArea={},porVaga=new Map();
  (ins||[]).forEach(i=>{const sg=i.marcas?.segmento;if(segArea.has(sg))(naArea[sg]=naArea[sg]||[]).push(mc(i));else if(i.vaga_id)porVaga.set(i.vaga_id,mc(i))});
  let img;try{img=await carregaImg(m.imagem_url)}catch{toast('Não consegui carregar a planta');return}
  const W=Math.max(2400,img.naturalWidth),IH=Math.round(img.naturalHeight*W/img.naturalWidth);
  const vagas=[...S.vagasEd];const larM=vagas.length?vagas.reduce((t,v)=>t+v.largura,0)/vagas.length/100*W:80,altM=vagas.length?vagas.reduce((t,v)=>t+v.altura,0)/vagas.length/100*IH:60;
  const fsN=Math.max(14,Math.min(30,larM*.19)),fsD=Math.round(fsN*.92),lh=fsN*1.12;
  const vao=v=>{const px=v.x/100*W,py=v.y/100*IH;let d=Infinity;vagas.forEach(u=>{if(u===v)return;if(Math.abs(u.y/100*IH-py)<altM*.6)d=Math.min(d,Math.abs(u.x/100*W-px))});return d===Infinity?larM*1.6:d};

    if(ls.length>maxL){ls.length=maxL;const k=maxL-1;while(cx.measureText(ls[k]+'…').width>max&&ls[k].length>2)ls[k]=ls[k].slice(0,-1);ls[k]+='…'}return ls};
  const etiqueta=(x,yTop,largura,o,alin='center',maxL=2,esc=1)=>{const fN=fsN*esc,fD=fsD*esc,L=lh*esc;cx.textAlign=alin;cx.textBaseline='top';cx.font=`700 ${fN}px Arial,sans-serif`;
    const ls=quebra(o.nome,largura,maxL);const bh=ls.length*L+(soNomes?4:fD*1.25+4);

  const plano=vagas.map(v=>{const h=v.altura/100*IH,x=v.x/100*W,topo=v.y/100*IH-h/2,base=v.y/100*IH+h/2,g=Math.max(4,fsN*.3),lw=Math.max(vao(v)-8,fsN*4);
    let esp=IH+BASE-base-g,acima=topo-g;vagas.forEach(u=>{if(u===v||Math.abs(u.x/100*W-x)>=lw*.75)return;const ut=u.y/100*IH-u.altura/100*IH/2,ub=u.y/100*IH+u.altura/100*IH/2;if(ut>base)esp=Math.min(esp,ut-base-g);if(ub<topo)acima=Math.min(acima,topo-ub-g)});

    if(p.subirF){cx.font=`700 ${fsN*esc}px Arial,sans-serif`;const n=quebra(o.nome,p.lw,maxL).length;const bh=n*lh*esc+(soNomes?4:fsD*esc*1.25+4);etiqueta(p.x,p.topo-p.g-bh,p.lw,o,'center',maxL,esc)}

    p.forEach(o=>{y+=etiqueta(x,y,Math.max(bw,fsN*8),o,'left')+fsN*.4})});

/* ajustar posição da logo */
function abrirRecorte(src){
  const D=240,st={x:0,y:0,z:1,w:0,h:0,b:1};
  const fundo=document.createElement('div');fundo.className='recorte-fundo';
  fundo.innerHTML=`<div class="recorte-folha" role="dialog" aria-modal="true" aria-labelledby="rc-t"><h2 id="rc-t" style="margin:0">Ajuste a logo</h2><p class="sub" style="margin:4px 0 0">Arraste a imagem e use o controle pra aproximar.</p>
  <div class="recorte" id="rc-area"><img id="rc-img" alt="Pré-visualização da logo"></div>
  <label for="rc-zoom" style="margin:0 0 4px;text-align:left">Zoom</label><input id="rc-zoom" type="range" min="1" max="4" step="0.01" value="1">
  <div class="row" style="margin-top:14px"><button class="btn sec" id="rc-cancela">Cancelar</button><button class="btn pri" id="rc-ok">Usar essa posição</button></div></div>`;
  document.body.appendChild(fundo);
  const img=fundo.querySelector('#rc-img'),area=fundo.querySelector('#rc-area'),zoom=fundo.querySelector('#rc-zoom');
  if(!/^blob:/.test(src))img.crossOrigin='anonymous';
  const limita=()=>{const W=st.w*st.b*st.z,H=st.h*st.b*st.z,mx=Math.max(0,(W-D)/2),my=Math.max(0,(H-D)/2);st.x=Math.min(mx,Math.max(-mx,st.x));st.y=Math.min(my,Math.max(-my,st.y))};
  const aplica=()=>{limita();const W=st.w*st.b*st.z,H=st.h*st.b*st.z;img.style.width=W+'px';img.style.height=H+'px';img.style.left=((D-W)/2+st.x)+'px';img.style.top=((D-H)/2+st.y)+'px'};
  img.onload=()=>{st.w=img.naturalWidth;st.h=img.naturalHeight;st.b=Math.max(D/st.w,D/st.h);aplica()};
  img.onerror=()=>{toast('Não consegui abrir a imagem');fecha()};
  img.src=src;
  let arr=null;
  area.addEventListener('pointerdown',ev=>{arr={x:ev.clientX,y:ev.clientY,ox:st.x,oy:st.y};area.setPointerCapture(ev.pointerId)});
  area.addEventListener('pointermove',ev=>{if(!arr)return;st.x=arr.ox+ev.clientX-arr.x;st.y=arr.oy+ev.clientY-arr.y;aplica()});
  const solta=()=>{arr=null};area.addEventListener('pointerup',solta);area.addEventListener('pointercancel',solta);
  zoom.addEventListener('input',()=>{st.z=+zoom.value;aplica()});
  function fecha(){fundo.remove();if(/^blob:/.test(src))URL.revokeObjectURL(src)}
  fundo.querySelector('#rc-cancela').onclick=fecha;
  fundo.querySelector('#rc-ok').onclick=async ev=>{const bt=ev.currentTarget;bt.disabled=true;
    try{const O=600,k=O/D,W=st.w*st.b*st.z,H=st.h*st.b*st.z;const cv=document.createElement('canvas');cv.width=O;cv.height=O;const cx=cv.getContext('2d');
      cx.fillStyle='#fff';cx.fillRect(0,0,O,O);cx.drawImage(img,((D-W)/2+st.x)*k,((D-H)/2+st.y)*k,W*k,H*k);
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));if(!blob)throw new Error('sem imagem');
      toast('Enviando logo…');const path=`${S.sessao.user.id}/logo-${Date.now()}.png`;const r=await sb.storage.from('fotos-marcas').upload(path,blob,{contentType:'image/png'});
      if(r.error)throw r.error;S.logo=sb.storage.from('fotos-marcas').getPublicUrl(path).data.publicUrl;fecha();
      const pv=document.getElementById('logo-prev');if(pv)pv.innerHTML=`<img class="logo" src="${esc(S.logo)}" alt="Logo" width="84" height="84" style="width:84px;height:84px">`;
      const lb=document.querySelector('label[for="m-logo"]');if(lb){lb.textContent='Trocar imagem da logo';if(!document.getElementById('logo-ajustar'))lb.insertAdjacentHTML('afterend','<button class="btn sec" id="logo-ajustar" style="min-height:44px;font-size:15px;font-weight:700">Ajustar posição</button>')}
      toast('Logo ajustada. Lembre de salvar a marca.')}
    catch(e){bt.disabled=false;toast(/tainted|insecure|cross/i.test(String(e))?'Não consegui ajustar essa imagem. Escolha a imagem de novo pela galeria.':erroMsg(e))}};
}

  <div class="painel" style="margin-bottom:10px">${lista.map(i=>{const z=zap(i.marcas?.whatsapp);return `<div class="kv" style="align-items:center"><span style="color:var(--ink)"><b>${esc(i.marcas?.nome||'Marca')}</b><br><small style="color:var(--ink-2)">${tamLabel(i.tamanho)} · ${i.pago?money(valor(i))+' pago':i.status==='confirmada'?'sem pagamento':'inscrição recebida'}</small></span></div>`}).join('')}</div>
  <a class="btn sec" href="https://wa.me/?text=${encodeURIComponent(resumo)}" target="_blank" rel="noopener" style="text-decoration:none;margin-bottom:8px">Enviar resumo pelo WhatsApp</a>

let locTimer=null,locSeq=0,locRes=[];
function fmtEndereco(p){const rua=[p.street,p.housenumber].filter(Boolean).join(', ');return [rua,p.district||p.locality,p.city||p.town||p.village,p.state].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' - ')}
async function buscaLocal(q){

  try{const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=-29.17&lon=-51.18&limit=6`);const j=await r.json();if(seq!==locSeq)return;
    locRes=(j.features||[]).filter(f=>f.properties&&(f.properties.countrycode||'').toUpperCase()==='BR').map(f=>({nome:f.properties.name||fmtEndereco(f.properties),end:fmtEndereco(f.properties)})).filter(x=>x.end);
    sug.innerHTML=locRes.length?locRes.map((x,k)=>`<button type="button" role="option" data-locsug="${k}"><b>${esc(x.nome)}</b><small>${esc(x.end)}</small></button>`).join(''):'<div class="vz">Não achei esse local. Preencha o endereço à mão.</div>';
  }catch{if(seq===locSeq)sug.innerHTML='<div class="vz">Busca indisponível agora. Preencha o endereço à mão.</div>'}
}

  const M=1600,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));return b||f}catch{return f}}

const OCR={tess:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',worker:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',core:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1',lang:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/por@1.0.0/4.0.0_best_int',pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'};

async function ocrImagem(src){await carregaScript(OCR.tess);if(!ocrWorker)ocrWorker=await Tesseract.createWorker('por',1,{workerPath:OCR.worker,corePath:OCR.core,langPath:OCR.lang});const {data}=await ocrWorker.recognize(src);return data.text||''}
async function textoComprovante(url){const r=await fetch(url);const bl=await r.blob();
  if(bl.type==='application/pdf'||/\.pdf(\?|$)/i.test(url)){await carregaScript(OCR.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=OCR.pdfw;
    const pdf=await pdfjsLib.getDocument({data:await bl.arrayBuffer()}).promise;const pg=await pdf.getPage(1);const tc=await pg.getTextContent();
    let linhas=[],ult=null,atual='';tc.items.forEach(it=>{const y=Math.round(it.transform[5]);if(ult!==null&&Math.abs(y-ult)>3){linhas.push(atual);atual=''}atual+=(atual&&!it.str.startsWith(' ')?' ':'')+it.str;ult=y});linhas.push(atual);
    const t=linhas.join('\n');if(t.replace(/\s/g,'').length>30)return t;
    const vp=pg.getViewport({scale:2.2});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;return ocrImagem(cv)}
  return ocrImagem(bl)}
function extrairPix(texto){
  const L=String(texto||'').split(/\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
  const ORIG=/^(origem|de|de:|pagador|dados do pagador|quem pagou|dados de quem pagou|quem enviou|remetente|conta de origem|enviado por|dados da origem)\b/i;
  const DEST=/^(destino|para|para:|recebedor|dados do recebedor|quem recebeu|dados de quem recebeu|favorecido|destinat[aá]rio|conta de destino|dados do destino|dados do favorecido)\b/i;
  const RUIM=/(cpf|cnpj|ag[eê]ncia|conta|chave|valor|data|hora|banco|pagamentos|institui|s\.?a\.?$|pix|transa|autentica|comprovante|id\b|tipo|ip:|\d{3})/i;
  const pareceNome=s=>{const t=s.replace(/^nome\s*:?\s*/i,'').trim();if(t.length<5||t.length>70||RUIM.test(t))return '';if(!/^[A-Za-zÀ-ÿ'´`. -]+$/.test(t))return '';if(t.split(' ').filter(w=>w.length>1).length<2)return '';return t};
  const titulo=s=>s.toLowerCase().replace(/(^|\s)([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Da|Do|Dos|Das|E)\b/g,w=>w.toLowerCase());
  let nome='';
  for(let i=0;i<L.length&&!nome;i++){const ln=L[i];const mOrig=ln.match(ORIG);if(!mOrig)continue;
    const resto=ln.slice(mOrig[0].length).replace(/^[\s:]+/,'');if(resto){const n=pareceNome(resto);if(n){nome=n;break}}
    for(let j=i+1;j<Math.min(L.length,i+9);j++){if(DEST.test(L[j]))break;const lj=L[j];
      if(/^nome\b/i.test(lj)){const n=pareceNome(lj)||pareceNome(L[j+1]||'');if(n){nome=n;break}continue}
      const n=pareceNome(lj);if(n){nome=n;break}}}
  if(!nome){for(let i=0;i<L.length;i++){if(/^nome\b/i.test(L[i])){let dest=false;for(let k=Math.max(0,i-4);k<i;k++)if(DEST.test(L[k]))dest=true;if(dest)continue;const n=pareceNome(L[i])||pareceNome(L[i+1]||'');if(n){nome=n;break}}}}
  const mv=String(texto).match(/R\$\s*([\d.]+,\d{2})/);const valor=mv?Number(mv[1].replace(/\./g,'').replace(',','.')):null;
  const md=String(texto).match(/\b(\d{2}\/\d{2}\/\d{4})\b/)||String(texto).match(/\b(\d{1,2} (?:de )?[A-Za-zç]{3,9}\.? (?:de )?\d{4})\b/i);
  return {nome:nome?(nome===nome.toUpperCase()?titulo(nome):nome):'',valor,data:md?md[1]:''}}
async function lerComprovanteDe(ins,todos){const L=(ins.comprovantes||[]).length?ins.comprovantes:(ins.comprovante_path?[{path:ins.comprovante_path}]:[]);const alvo=L.filter(c=>todos||!c.lido);if(!alvo.length)return null;
  const {data:us}=await sb.storage.from('comprovantes').createSignedUrls(alvo.map(c=>c.path),600);const url={};(us||[]).forEach(x=>{if(x.signedUrl)url[x.path]=x.signedUrl});
  let primeiro=null,soma=0;for(const c of alvo){if(!url[c.path])continue;try{const x=extrairPix(await textoComprovante(url[c.path]));if(x.nome&&!primeiro)primeiro=x.nome;if(x.valor)soma+=x.valor;

  if(t.id==='org-seg'){const novo=t.value,ant=t.dataset.atual;if(novo===ant)return;
    if(!confirm(`Mudar o segmento de ${segNome(ant)} pra ${segNome(novo)}? Isso vale pra marca em todas as edições.`)){t.value=ant;return}
    t.disabled=true;const {error}=await sb.from('marcas').update({segmento:novo,...(novo!=='outro'?{segmento_outro:null}:{})}).eq('id',t.dataset.marca);t.disabled=false;
    if(error){t.value=ant;toast(erroMsg(error));return}toast(`Segmento alterado pra ${segNome(novo)}`);const y=window.scrollY;await render();window.scrollTo(0,y);return}
  if(t.id==='rl-sim'){const w=$('#rl-w');if(w)w.hidden=!t.checked;return}
  if(t.id==='ins-monta'||t.id==='ed-monta'){const av=t.closest('.monta-q')?.querySelector('.aviso-monta');if(av)av.hidden=!t.checked;
    if(t.id==='ed-monta'){t.disabled=true;const r=await sb.rpc('definir_monta_no_dia',{p_inscricao:S.ins.id,p_valor:t.checked});t.disabled=false;if(r.error){t.checked=!t.checked;if(av)av.hidden=!t.checked;toast(erroMsg(r.error));return}S.ins.monta_no_dia=t.checked;toast(t.checked?'Anotado: você monta no dia da feira':'Anotado: você monta no dia da montagem')}return}
  if(t.id==='e-sinal'){const w=$('#e-venc-w');if(w)w.hidden=!t.checked;dicaVenc();return}
  if(t.id==='e-venc'){t.dataset.auto='';return}
  if(t.id==='e-rllim'){t.dataset.auto='';return}
  if(t.id==='e-prazo'){t.dataset.auto='';return}
  if(t.id==='e-roleta'){const w=$('#e-rl-w');if(w)w.hidden=!t.checked;dicaRoleta();return}
  if(t.id==='e-data'){const vi=$('#e-venc');if(vi&&vi.dataset.auto==='1')vi.value='';dicaVenc();const rl=$('#e-rllim');if(rl&&rl.dataset.auto==='1'){rl.value='';rl.dispatchEvent(new Event('input'))}dicaRoleta();const pz=$('#e-prazo');if(pz&&pz.dataset.auto==='1'){pz.value='';pz.dispatchEvent(new Event('input'))}dicaPrazoVaga()}
  if(t.id==='e-diaun'){const w=$('#e-pdia-w');if(w)w.hidden=!t.checked;return}
  if(t.id==='e-hf2'&&t.value){const d=$('#e-hd1');if(d&&(!d.value||d.dataset.auto==='1')){d.value=t.value;d.dataset.auto='1'}return}
  if(t.id==='e-hd1'){t.dataset.auto='0';return}
  if(t.id==='e-aberta'&&t.checked){const a=$('#e-abre');if(a){a.value='';a.dispatchEvent(new Event('input'))}}
  if(t.id==='e-abre'&&t.value){const c=$('#e-aberta');if(c)c.checked=false}
  if(t.id==='m-seg'){const w=$('#m-outro-w');if(w)w.hidden=t.value!=='outro';return}
  if(t.id==='mo-est'){$('#mo-placa-w').hidden=!t.checked;return}
  if(t.id==='sel-ed'||t.id==='lista-ed'){S.orgEdicao=t.value;S.filtroSel='todas';render();return}
  if(t.id==='fb-ed'){S.fbEd=t.value;render();return}
  if(t.id==='mp-sel'){S.mapaSel=t.value;S.vagaSel=null;S.mapaEdSel=null;render();return}
  if(t.id==='mp-ed'){S.mapaEdSel=t.value;render();return}
  if(t.dataset.conta){const v=t.value.trim()||null;const r=await sb.from('inscricoes').update({conta_recebimento:v}).eq('id',t.dataset.conta);toast(r.error?erroMsg(r.error):v?'Conta salva: '+v:'Conta apagada');if(!r.error&&v&&!(S.contasUsadas||[]).includes(v))(S.contasUsadas=S.contasUsadas||[]).push(v);return}
  if(t.dataset.pagador){const v=t.value.trim()||null;const r=await sb.from('inscricoes').update({pagador_nome:v}).eq('id',t.dataset.pagador);toast(r.error?erroMsg(r.error):'Salvo');return}
  if(t.dataset.isento){const r=await sb.from('inscricoes').update(t.checked?{isento:true,pago:true,comprovante_novo:false}:{isento:false}).eq('id',t.dataset.isento);toast(r.error?erroMsg(r.error):t.checked?'Marcado como não paga':'Voltou a pagar normalmente');if(!r.error){const y=window.scrollY;await render();window.scrollTo(0,y)}return}
  if(t.dataset.sinal){const r=await sb.from('inscricoes').update({pago_sinal:t.checked,...(t.checked?{comprovante_novo:false}:{})}).eq('id',t.dataset.sinal);await contaComprovantes();toast(r.error?erroMsg(r.error):t.checked?'Metade registrada. O mapa foi liberado pro expositor.':'Metade desmarcada');if(!r.error){const y=window.scrollY;await render();window.scrollTo(0,y)}return}
  if(t.dataset.pago){const r=await sb.from('inscricoes').update({pago:t.checked,...(t.checked?{comprovante_novo:false}:{})}).eq('id',t.dataset.pago);await contaComprovantes();toast(r.error?erroMsg(r.error):t.checked?'Pagamento registrado. O mapa foi liberado pro expositor.':'Pagamento desmarcado');if(!r.error)render();return}
  if(t.dataset.pst){await sb.from('propostas_espacos').update({status:t.value}).eq('id',t.dataset.pst);toast('Status atualizado');return}
  if(t.id==='e-video'){const f=t.files[0];if(!f)return;if(!/^video\//.test(f.type)){toast('Escolha um vídeo');return}if(f.size>50*1024*1024){toast('O vídeo passa de 50 MB. Grave mais curto ou em qualidade menor.');return}
    toast('Enviando vídeo… pode levar um tempinho');const path=`${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const r=await sb.storage.from('videos').upload(path,f,{contentType:f.type});if(r.error){toast(erroMsg(r.error));return}
    S.videoForm=sb.storage.from('videos').getPublicUrl(path).data.publicUrl;await renderMantendo();toast('Vídeo anexado. Lembre de salvar a edição.');return}
  if(t.id==='e-capa'){const f=t.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Escolha uma imagem');return}if(f.size>8*1024*1024){toast('A imagem passa de 8 MB');return}toast('Enviando imagem…');
    const path=`${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const r=await sb.storage.from('capas').upload(path,f);if(r.error){toast(erroMsg(r.error));return}
    S.capaForm=sb.storage.from('capas').getPublicUrl(path).data.publicUrl;await renderMantendo();toast('Capa carregada. Lembre de salvar a edição.');return}
  if(t.id==='m-logo'){const f=t.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast('Escolha uma imagem (foto ou print da logo)');t.value='';return}
    abrirRecorte(URL.createObjectURL(f));t.value='';return}
  if(t.id==='m-file'){let files=[...t.files];t.value='';if(!files.length)return;
    const vagas=6-S.fotos.length;if(vagas<=0){toast('Já tem 6 fotos. Remova uma pra adicionar outra.');return}
    if(files.length>vagas){toast(`Dá pra adicionar só mais ${vagas} ${vagas===1?'foto':'fotos'}. Enviando as primeiras.`);files=files.slice(0,vagas)}
    toast('Enviando fotos…');
    for(const f of files){if(!/^image\//.test(f.type)){toast(`${f.name} não é uma imagem`);continue}
      const blob=await reduzFoto(f);if(blob.size>5*1024*1024){toast(`${f.name} é grande demais`);continue}
      const path=`${S.sessao.user.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;const r=await sb.storage.from('fotos-marcas').upload(path,blob,{contentType:blob.type||'image/jpeg'});
      if(r.error){toast(erroMsg(r.error));continue}S.fotos.push(sb.storage.from('fotos-marcas').getPublicUrl(path).data.publicUrl);desenhaFotos()}
    toast('Fotos adicionadas. Lembre de salvar a marca.');return}
  if(t.id==='comp-file'){const f=t.files[0];if(!f)return;if(f.size>10*1024*1024){toast('O arquivo passa de 10 MB');return}toast('Enviando comprovante…');
    const path=`${S.sessao.user.id}/${S.ins.id}-${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;const r=await sb.storage.from('comprovantes').upload(path,f);
    if(r.error){toast(erroMsg(r.error));return}const r2=await sb.rpc('enviar_comprovante',{p_inscricao:S.ins.id,p_path:path});
    if(r2.error){toast(erroMsg(r2.error));return}toast('Comprovante enviado!');render();return}
  if(t.id==='comp-org'||t.dataset.comporg){const f=t.files[0];if(!f)return;if(f.size>10*1024*1024){toast('O arquivo passa de 10 MB');return}
    const tipos=['image/jpeg','image/png','image/webp','image/heic','application/pdf'];if(f.type&&!tipos.includes(f.type)){toast('Use foto (JPG, PNG) ou PDF');return}
    toast('Anexando comprovante…');const nm=f.name.replace(/[^\w.]/g,'_');
    if(t.dataset.pre){const path=`pre/${t.dataset.pre}-${Date.now()}-${nm}`;const r=await sb.storage.from('comprovantes').upload(path,f,{contentType:f.type||undefined});if(r.error){toast(erroMsg(r.error));return}
      const r2=await sb.from('pre_inscricoes').update({comprovante_path:path}).eq('id',t.dataset.pre);if(r2.error){toast(erroMsg(r2.error));return}toast('Comprovante anexado');await renderMantendo();return}
    const path=`${t.dataset.dono}/${t.dataset.ins}-org-${Date.now()}-${nm}`;
    const r=await sb.storage.from('comprovantes').upload(path,f,{contentType:f.type||undefined});if(r.error){toast(erroMsg(r.error));return}
    const r2=await sb.from('inscricoes').update({comprovante_path:path,comprovante_em:new Date().toISOString(),...(t.dataset.semauto?{}:{pago:true})}).eq('id',t.dataset.ins);
    if(r2.error){toast(erroMsg(r2.error));return}toast(t.dataset.pagoja||t.dataset.semauto?'Comprovante anexado':'Comprovante anexado e pagamento marcado como recebido');const y=window.scrollY;await render();window.scrollTo(0,y);return}
  if(t.id==='mp-file'){const f=t.files[0];if(!f)return;toast('Enviando planta…');const path=`${S.mapaSel}/${Date.now()}-${f.name.replace(/[^\w.]/g,'_')}`;
    const r=await sb.storage.from('mapas').upload(path,f);if(r.error){toast(erroMsg(r.error));return}
    const url=sb.storage.from('mapas').getPublicUrl(path).data.publicUrl;const r2=await sb.from('mapas').update({imagem_url:url}).eq('id',S.mapaSel);if(r2.error){toast(erroMsg(r2.error));return}toast('Planta atualizada');await render();if(!S.vagasEd?.length)await criarVagasDaPlanta(true);return}
});
let ultAtualiza=Date.now();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!S.sessao)return;if(Date.now()-ultAtualiza<30000)return;
  if(!['org-selecao','org-mapas','org-lista','org-feedback','org-inscrito','org-edicoes','inicio','edicao','mapa'].includes(S.tela))return;
  const f=document.activeElement;if(f&&f.closest&&f.closest('#tela')&&/INPUT|TEXTAREA|SELECT/.test(f.tagName))return;ultAtualiza=Date.now();contaComprovantes().then(renderMantendo)});
document.addEventListener('keydown',ev=>{const t=ev.target.closest&&ev.target.closest('[data-perfil]');if(t&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();S.perfilId=t.dataset.perfil;go('org-inscrito')}});
document.addEventListener('click',ev=>{const sg=$('#loc-sug');if(sg&&!sg.hidden&&!ev.target.closest('#loc-sug')&&ev.target.id!=='e-local')sg.hidden=true},true);
window.addEventListener('hashchange',()=>{if(location.hash==='#proposta')go('proposta')});
iniciar();

<script>if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script><script>(function(){const atual=document.querySelector('meta[name=app-versao]')?.content;let checando=false;
async function checa(){if(checando||!atual)return;checando=true;try{const r=await fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'});const t=await r.text();const m=t.match(/name="app-versao" content="([^"]+)"/);
 if(m&&m[1]!==atual&&!new URLSearchParams(location.search).has('v')&&sessionStorage.getItem('berga-tentou')!==m[1]){try{sessionStorage.setItem('berga-tentou',m[1])}catch{}const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){checando=false;return}try{sessionStorage.setItem('berga-atualizou','1')}catch{}location.replace(location.pathname+'?v='+m[1])}}catch{}checando=false}
setTimeout(checa,1500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checa()});setInterval(checa,5*60*1000);
try{if(sessionStorage.getItem('berga-atualizou')){sessionStorage.removeItem('berga-atualizou');setTimeout(()=>{try{toast('App atualizado ✨')}catch{}},1800)}}catch{}
if(/[?&]v=/.test(location.search)){try{history.replaceState(null,'',location.pathname+location.hash)}catch{}}})();</script></body>
